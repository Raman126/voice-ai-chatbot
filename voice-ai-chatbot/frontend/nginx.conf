server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container so the browser only ever
    # talks to one origin (this one) — sidesteps CORS in the Docker setup.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Whisper transcription uploads can take a moment on slower connections
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    # SPA fallback: any non-file route goes to index.html so React Router
    # (or simple client-side state) handles it instead of nginx 404-ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets; index.html itself is
    # excluded above so new deploys are picked up immediately.
    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
